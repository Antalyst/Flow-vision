<text x="770.0" y="118.0" font-size="22" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">PROCESS</text>
<text x="572" y="186" font-size="16" font-weight="bold" fill="#000">1. Authentication &amp; Access Control</text>
<text x="578" y="213" font-size="15" fill="#000">•</text>
<text x="594" y="213" font-size="15" fill="#000">Login and session validation</text>
<text x="578" y="239" font-size="15" fill="#000">•</text>
<text x="594" y="239" font-size="15" fill="#000">Role-based access (Admin, Department Head, Staff,</text>
<text x="594" y="260" font-size="15" fill="#000">Liaison) scoped to the organization and office</text>
<text x="572" y="303" font-size="16" font-weight="bold" fill="#000">2. Organization Setup</text>
<text x="578" y="330" font-size="15" fill="#000">•</text>
<text x="594" y="330" font-size="15" fill="#000">Office network and route builder</text>
<text x="578" y="356" font-size="15" fill="#000">•</text>
<text x="594" y="356" font-size="15" fill="#000">User provisioning and whitelist import</text>
<text x="572" y="399" font-size="16" font-weight="bold" fill="#000">3. Document Registration</text>
<text x="578" y="426" font-size="15" fill="#000">•</text>
<text x="594" y="426" font-size="15" fill="#000">Generate unique tracking code (FLOW-xxxx)</text>
<text x="578" y="452" font-size="15" fill="#000">•</text>
<text x="594" y="452" font-size="15" fill="#000">Generate QR code and embed it in the DOCX / XLSX</text>
<text x="594" y="473" font-size="15" fill="#000">file</text>
<text x="578" y="499" font-size="15" fill="#000">•</text>
<text x="594" y="499" font-size="15" fill="#000">Store file; AI suggests title and summary</text>
<text x="572" y="542" font-size="16" font-weight="bold" fill="#000">4. QR-Based Routing &amp; Chain of Custody</text>
<text x="578" y="569" font-size="15" fill="#000">•</text>
<text x="594" y="569" font-size="15" fill="#000">Assign liaison; validate each drop-off against the</text>
<text x="594" y="590" font-size="15" fill="#000">route</text>
<text x="578" y="616" font-size="15" fill="#000">•</text>
<text x="594" y="616" font-size="15" fill="#000">Status flow: Created → Picked Up → In Transit →</text>
<text x="594" y="637" font-size="15" fill="#000">Arrived → Completed / Discrepancy</text>
<text x="578" y="663" font-size="15" fill="#000">•</text>
<text x="594" y="663" font-size="15" fill="#000">Desk transfer, release request and approval</text>
<text x="578" y="689" font-size="15" fill="#000">•</text>
<text x="594" y="689" font-size="15" fill="#000">Record every handoff as a tracking event</text>
<text x="572" y="732" font-size="16" font-weight="bold" fill="#000">5. Monitoring &amp; Analytics</text>
<text x="578" y="759" font-size="15" fill="#000">•</text>
<text x="594" y="759" font-size="15" fill="#000">SLA compliance and breach detection</text>
<text x="578" y="785" font-size="15" fill="#000">•</text>
<text x="594" y="785" font-size="15" fill="#000">Workload and bottleneck analysis</text>
<text x="578" y="811" font-size="15" fill="#000">•</text>
<text x="594" y="811" font-size="15" fill="#000">7-day traffic forecast and workload prediction</text>
<text x="572" y="854" font-size="16" font-weight="bold" fill="#000">6. AI Assistant (Groq LLM)</text>
<text x="578" y="881" font-size="15" fill="#000">•</text>
<text x="594" y="881" font-size="15" fill="#000">Intent classification and natural-language data</text>
<text x="594" y="902" font-size="15" fill="#000">queries</text>
<text x="578" y="928" font-size="15" fill="#000">•</text>
<text x="594" y="928" font-size="15" fill="#000">Semantic search, summarization, office/route Q&amp;A</text>
<text x="578" y="954" font-size="15" fill="#000">•</text>
<text x="594" y="954" font-size="15" fill="#000">Answers grounded in the org knowledge base</text>
<text x="572" y="997" font-size="16" font-weight="bold" fill="#000">7. Communication &amp; Audit</text>
<text x="578" y="1024" font-size="15" fill="#000">•</text>
<text x="594" y="1024" font-size="15" fill="#000">In-app notifications and email alerts</text>
<text x="578" y="1050" font-size="15" fill="#000">•</text>
