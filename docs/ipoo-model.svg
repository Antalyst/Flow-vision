<text x="532" y="186" font-size="16" font-weight="bold" fill="#000">1. Authentication &amp; Access Control</text>
<text x="538" y="213" font-size="15" fill="#000">•</text>
<text x="554" y="213" font-size="15" fill="#000">Login and session validation</text>
<text x="538" y="239" font-size="15" fill="#000">•</text>
<text x="554" y="239" font-size="15" fill="#000">Role-based access (Admin, Department Head,</text>
<text x="554" y="260" font-size="15" fill="#000">Staff, Liaison) scoped to the organization and</text>
<text x="554" y="281" font-size="15" fill="#000">office</text>
<text x="532" y="324" font-size="16" font-weight="bold" fill="#000">2. Organization Setup</text>
<text x="538" y="351" font-size="15" fill="#000">•</text>
<text x="554" y="351" font-size="15" fill="#000">Office network and route builder</text>
<text x="538" y="377" font-size="15" fill="#000">•</text>
<text x="554" y="377" font-size="15" fill="#000">User provisioning and whitelist import</text>
<text x="532" y="420" font-size="16" font-weight="bold" fill="#000">3. Document Registration</text>
<text x="538" y="447" font-size="15" fill="#000">•</text>
<text x="554" y="447" font-size="15" fill="#000">Generate unique tracking code (FLOW-xxxx)</text>
<text x="538" y="473" font-size="15" fill="#000">•</text>
<text x="554" y="473" font-size="15" fill="#000">Generate QR code and embed it in the DOCX /</text>
<text x="554" y="494" font-size="15" fill="#000">XLSX file</text>
<text x="538" y="520" font-size="15" fill="#000">•</text>
<text x="554" y="520" font-size="15" fill="#000">Store file; AI suggests title and summary</text>
<text x="532" y="563" font-size="16" font-weight="bold" fill="#000">4. QR-Based Routing &amp; Chain of Custody</text>
<text x="538" y="590" font-size="15" fill="#000">•</text>
<text x="554" y="590" font-size="15" fill="#000">Assign liaison; validate each drop-off against</text>
<text x="554" y="611" font-size="15" fill="#000">the route</text>
<text x="538" y="637" font-size="15" fill="#000">•</text>
<text x="554" y="637" font-size="15" fill="#000">Status flow: Created → Picked Up → In Transit</text>
<text x="554" y="658" font-size="15" fill="#000">→ Arrived → Completed / Discrepancy</text>
<text x="538" y="684" font-size="15" fill="#000">•</text>
<text x="554" y="684" font-size="15" fill="#000">Desk transfer, release request and approval</text>
<text x="538" y="710" font-size="15" fill="#000">•</text>
<text x="554" y="710" font-size="15" fill="#000">Record every handoff as a tracking event</text>
<text x="532" y="753" font-size="16" font-weight="bold" fill="#000">5. Monitoring &amp; Analytics</text>
<text x="538" y="780" font-size="15" fill="#000">•</text>
<text x="554" y="780" font-size="15" fill="#000">SLA compliance and breach detection</text>
<text x="538" y="806" font-size="15" fill="#000">•</text>
<text x="554" y="806" font-size="15" fill="#000">Workload and bottleneck analysis</text>
<text x="538" y="832" font-size="15" fill="#000">•</text>
<text x="554" y="832" font-size="15" fill="#000">7-day traffic forecast and workload prediction</text>
<text x="532" y="875" font-size="16" font-weight="bold" fill="#000">6. AI Assistant (Groq LLM)</text>
<text x="538" y="902" font-size="15" fill="#000">•</text>
<text x="554" y="902" font-size="15" fill="#000">Intent classification and natural-language</text>
<text x="554" y="923" font-size="15" fill="#000">data queries</text>
<text x="538" y="949" font-size="15" fill="#000">•</text>
<text x="554" y="949" font-size="15" fill="#000">Semantic search, summarization, office/route</text>
<text x="554" y="970" font-size="15" fill="#000">Q&amp;A</text>
<text x="538" y="996" font-size="15" fill="#000">•</text>
<text x="554" y="996" font-size="15" fill="#000">Answers grounded in the org knowledge base</text>
<text x="532" y="1039" font-size="16" font-weight="bold" fill="#000">7. Communication &amp; Audit</text>
<text x="538" y="1066" font-size="15" fill="#000">•</text>
